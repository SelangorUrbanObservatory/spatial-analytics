<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fb"><title>Spatial Analytics | Selangor Urban Observatory</title>
<meta name="description" content="SUO Spatial Analytics workspace — tema cerah Selangor, enjin analisis asal dikekalkan.">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#f6f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}
#engine{display:block;width:100%;height:100%;height:100dvh;border:0;opacity:0;transition:opacity .18s}
#engine.ready{opacity:1}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#536172;font-size:14px;pointer-events:none}
#loading strong{font-size:17px;color:#293549}
#loading:before{content:"SUO";background:linear-gradient(135deg,#edbe3e,#ffe39a);color:#982c38;padding:17px 15px;border-radius:16px;font-weight:900;letter-spacing:-.06em}
#loading.hidden{display:none}
</style></head>
<body>
<div id="loading" role="status" aria-live="polite"><strong>Spatial Analytics SUO</strong><span>Memuatkan workspace analisis...</span></div>
<iframe id="engine" src="./engine.html" title="SUO Spatial Analytics Engine" allow="fullscreen"></iframe>
<script>
(function(){
  const frame=document.getElementById('engine'), loading=document.getElementById('loading');
  let shown=false;
  const reveal=function(){if(shown)return;shown=true;frame.classList.add('ready');loading.classList.add('hidden')};
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.head){reveal();return}
      const sheet=doc.createElement('link');
      sheet.rel='stylesheet';sheet.href='./css/suo-theme.css?v=20261103';
      sheet.onload=reveal;sheet.onerror=reveal;
      doc.head.appendChild(sheet);
      frame.contentWindow.addEventListener('beforeunload',function(){shown=false;frame.classList.remove('ready');loading.classList.remove('hidden')},{once:true});
    }catch(error){console.warn('Theme style unavailable:',error);reveal()}
  });
  window.setTimeout(reveal,9000);
})();
</script>
</body></html>
